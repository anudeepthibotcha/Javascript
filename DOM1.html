<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Specifies the character encoding used by the webpage -->
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title displayed in the browser tab -->
    <title>Document</title>

    <style>
        /* Styles the main Todo App container */
        #id1 {
            border: 2px solid black;
            width: 300px;
            height: 300px;
            padding-left: 20px;
        }

        /* Styles the Add (+) button */
        #add {
            background-color: blueviolet;
        }

        /* Styles the container where todo items are displayed */
        #id2 {
            border: 1px solid grey;
            background-color: gainsboro;
            margin-bottom: 20px;
            margin-right: 30px;
        }

        /* Styles the digital clock container */
        #id3 {
            border: 2px solid black;
            width: 200px;
            height: 200px;

            /* Vertically aligns the content */
            align-content: center;

            /* Centers the text horizontally */
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Todo App container -->
    <div id="id1">
        <h2>Todo App</h2>

        <!-- Input field used to enter a new todo item -->
        <input type="text" id="input" value="Add your new todo"/>

        <!-- Button used to add the entered todo item -->
        <button id="add">+</button>
        <br><br>

        <!-- Container where newly added todo items will appear -->
        <div id="id2">

        </div>
    </div>

    <br><br>

    <!-- Digital clock and Check In/Check Out section -->
    <div id="id3">
        <h2>
            Time:
            <!-- Displays the current hour -->
            <span id="hr">00</span> :

            <!-- Displays the current minute -->
            <span id="min">00</span> :

            <!-- Displays the current second -->
            <span id="sec">00</span>
        </h2>

        <!-- Calls cin() when the Check In button is clicked -->
        <button onclick="cin()">Check In</button>

        <!-- Calls cout() when the Check Out button is clicked -->
        <button onclick="cout()">Check Out</button>
        <br><br>

        <!-- Displays the latest check-in time -->
        <p>Latest Check In: <span id="in"></span></p>

        <!-- Displays the latest check-out time -->
        <p>Latest Check Out: <span id="out"></span></p>
    </div>

    <br><br>

    <!-- Button used to generate a random OTP -->
    <button id="b">Get OTP</button>
    <br><br>

    <script>
        /*
         * Selects the Add button using its ID.
         * querySelector() returns the matching HTML element.
         */
        let add = document.querySelector("#add")

        /*
         * Selects the input field where the user enters the todo.
         */
        let input = document.querySelector("#input")

        /*
         * Selects the div where todo items will be displayed.
         */
        let d1 = document.querySelector("#id2")

        /*
         * Adds a click event listener to the Add button.
         * This function runs whenever the user clicks the + button.
         */
        add.addEventListener('click', () => {

            // Gets the text entered by the user
            data = input.value

            // Creates a new <div> element for the todo item
            let div = document.createElement('div')

            // Places the entered todo text inside the new div
            div.innerHTML = data

            // Adds the newly created div to the todo container
            d1.appendChild(div)

            // Clears the input field after adding the todo
            input.value = ""
        })


        /*
         * The following code is commented out.
         * It demonstrates different Date object methods.
         *
         * toLocaleString() -> returns the current date and time
         * getMonth()      -> returns the month (0 to 11)
         * getMilliseconds()-> returns milliseconds
         * getFullYear()   -> returns the current year
         * getHours()      -> returns the current hour
         * getMinutes()    -> returns the current minute
         * getSeconds()    -> returns the current second
         */

        /*
        const d = new Date().toLocaleString()
        const m = new Date().getMonth()
        const ms = new Date().getMilliseconds()
        const y = new Date().getFullYear()
        const h = new Date().getHours()
        const min = new Date().getMinutes()
        const s = new Date().getSeconds()

        document.write(d + "<br/>")
        document.write(m + 1 + "<br/>")
        document.write(ms + "<br/>")
        document.write(y + "<br/>")
        document.write(h + "<br/>")
        document.write(min + "<br/>")
        document.write(s + "<br/>")
        */


        /*
         * Creates a Date object and converts it into
         * a readable local date and time format.
         */
        const d = new Date().toLocaleString()

        // Displays the current date and time on the webpage
        document.write("Date: " + d + "<br/>")


        /*
         * Function to display the current system time.
         * It gets the current hour, minute, and second.
         */
        function clock() {

            // Gets the current hour
            let h = new Date().getHours()

            // Gets the current minute
            let m = new Date().getMinutes()

            // Gets the current second
            let s = new Date().getSeconds()

            // Updates the hour displayed in the HTML
            document.getElementById("hr").innerHTML = h

            // Updates the minute displayed in the HTML
            document.getElementById("min").innerHTML = m

            // Updates the second displayed in the HTML
            document.getElementById("sec").innerHTML = s
        }


        /*
         * Calls the clock() function every 1000 milliseconds (1 second).
         * This keeps the digital clock updated continuously.
         */
        setInterval(clock, 1000)


        /*
         * Function executed when the Check In button is clicked.
         */
        function cin() {

            // Gets the current local time
            let t = new Date().toLocaleTimeString()

            // Displays the check-in time
            document.getElementById("in").innerHTML = t
        }


        /*
         * Function executed when the Check Out button is clicked.
         */
        function cout() {

            // Gets the current local time
            let t = new Date().toLocaleTimeString()

            // Displays the check-out time
            document.getElementById("out").innerHTML = t
        }


        /*
         * Math.sqrt() returns the square root of a number.
         * Here, the square root of 5556 is displayed.
         */
        document.write(Math.sqrt(5556) + "<br/>")


        /*
         * Math.pow() calculates a number raised to a particular power.
         * Here, 68 is raised to the power of 24.
         */
        document.write(Math.pow(68, 24) + "<br/>")


        /*
         * Math.random() generates a random decimal number
         * between 0 (inclusive) and 1 (exclusive).
         * Multiplying by 100 gives a random value between 0 and 100.
         */
        document.write(Math.random() * 100 + "<br/>")


        /*
         * Math.exp() returns e raised to the given power.
         * Here, e is raised to the power of 11.
         */
        document.write(Math.exp(11) + "<br/>")


        /*
         * Variable used to store the generated OTP.
         */
        otp = 0


        /*
         * Selects the Get OTP button using its ID.
         */
        let b = document.querySelector("#b")


        /*
         * Adds a click event listener to the Get OTP button.
         * A new OTP is generated whenever the button is clicked.
         */
        b.addEventListener('click', () => {

            /*
             * Math.random() generates a random number.
             * Multiplying by 1000000 gives a range up to 999999.
             * Math.floor() removes the decimal part.
             *
             * This generates a 6-digit OTP in most cases,
             * although leading-zero OTPs are not preserved.
             */
            otp = Math.floor(Math.random() * 1000000)

            // Displays the generated OTP in an alert box
            alert("The otp is: " + otp)
        })
    </script>
</body>
</html>
