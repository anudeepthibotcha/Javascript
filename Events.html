<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function clicked() {
            alert("You ckicked a button")
        }
        function save() {
            alert("Saved changes successfully")
        }
        function back() {
            let ele=document.getElementById("id1")
            ele.innerHTML="Homepage"
            ele.style.backgroundColor="purple"
            ele.style.color="yellow"
        }
        function over() {
            alert("It's an art design")
        }
        function out() {
            alert("Pick any picture")
        }
        function moved() {
            alert("Mouse has moved")
        }
        function up() {
            document.getElementById("id2").style.backgroundColor="deeppink"
        }
        function down() {
            document.getElementById("id2").style.backgroundColor="green"
        }
        function focused(e1) {
            e1.style.backgroundColor="SeaGreen"
        }
        function blurred(e1) {
            e1.style.backgroundColor="DodgerBlue"
        }
        function change(e1) {
            e1.style.border="2px solid Indigo"
            alert("Username is changed")
        }
        function done() {
            alert("Form submitted successfully")
        }
        function again() {
            alert("Form resetted successfully")
        }
        function load() {
            alert("How can we serve you?")
        }
    </script>
</head>
<body>
    <button onclick="clicked()">Click Me</button>
    <button onclick="save()">Save</button>
    <h2 onclick="back()" id="id1">Hello, Welcome</h2>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSukIcYHIwokXoEeehciZrjNCU0FumLZY_0GltgZ6kR2Q&s=10" width="500" height="300" 
    onmouseover="over()" onmouseout="out()" onmousemove="moved()"/><br><br>
    <label>Username</label>
    <input type="text" placeholder="username" id="id2" onkeyup="up()" onkeydown="down()" /><br><br>
    <form onsubmit="done()" onreset="again()">
        <label>Username</label>
        <input type="text" placeholder="username" value="user" onchange="change(this)" onfocus="focused(this)" onblur="blurred(this)" required />
        <label>Password</label>
        <input type="text" placeholder="password" onfocus="focused(this)" onblur="blurred(this)" required />
        <input type="submit" />
        <input type="reset" />
    </form>
</body>
<body onload="load()">
    <h2>Welcome to our hotel</h2>
</body>
</html>
