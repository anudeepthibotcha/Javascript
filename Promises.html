    <script>
        async function info(name,age) {
            document.write(`My name is ${name} and am ${age}`+"<br/>")
        }
        info('Goofy','45')
        function done() {
            document.write("Identity checked"+"<br/>")
        }
        done()
        function data() {
            return new Promise((resolve,reject)=>{
                setInterval(()=>resolve("Data Checked successfully"),2000)
            })
        }
        async function get() {
            document.write("loading...."+"<br/>")
            let res=await data()
            document.write(res+"<br/>")
            document.write("Data checked"+"<br/>")
        }
        get()
        function task1() {
            return new Promise((resolve,reject)=>{
                let status=true
                if(status) {
                    setInterval(()=>resolve("First Task completed"+"<br/>"),3000)
                }
                else {
                    setInterval(()=>resolve("First Task yet to be completed"+"<br/>"),3000)
                }
            })
        }
        function task2() {
            return new Promise((resolve,reject)=>{
                let status=false
                if(status) {
                    setInterval(()=>resolve("Second Task completed"+"<br/>"),4000)
                }
                else {
                    setInterval(()=>resolve("Second Task yet to be completed"+"<br/>"),4000)
                }
            })
        }
        async function load() {
            document.write("loading...."+"<br/>")
            await task1()
            .then((res)=>document.write(res)+"<br/>")
            .catch((err)=>document.write(err)+"<br/>")
            await task2()
            .then((res)=>document.write(res)+"<br/>")
            .catch((err)=>document.write(err)+"<br/>")
            document.write("Tasks completed"+"<br/>")
        }
        load()
        function accept() {
            return new Promise((resolve,reject)=>{
                setInterval(()=>resolve("Accepting..."),3000)
            })
        }
        function conf() {
            return new Promise((resolve,reject)=>{
                setInterval(()=>resolve("Confirm"),3000)
            })
        }
        async function loade() {
            let res=document.getElementById("id1")
            res.innerHTML="loading...."
            res.style.backgroundColor="red"
            res.innerHTML=await accept()
            res.style.backgroundColor="yellow"
            res.innerHTML=await conf()
            res.style.backgroundColor="green"
        }
        loade()
    </script>
