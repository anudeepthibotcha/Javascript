    <script>

        /*
        ==========================================
        ASYNC FUNCTION
        ==========================================
        */

        // async allows a function to work with Promises
        async function info(name, age) {

            // Template literals allow variables to be inserted directly
            // into a string using ${variable}
            document.write(`My name is ${name} and am ${age}` + "<br/>")
        }

        // Calling the async function
        info('Goofy', '45')


        /*
        ==========================================
        NORMAL FUNCTION
        ==========================================
        */

        // Simple function that displays a message
        function done() {
            document.write("Identity checked" + "<br/>")
        }

        // Calling the function
        done()


        /*
        ==========================================
        PROMISE WITH ASYNC/AWAIT
        ==========================================
        */

        // This function returns a Promise
        function data() {

            return new Promise((resolve, reject) => {

                // setInterval() waits for 2 seconds before resolving
                setInterval(() => resolve("Data Checked successfully"), 2000)
            })
        }


        // async function used to handle the Promise
        async function get() {

            // Displays a loading message
            document.write("loading...." + "<br/>")

            // await pauses execution until the Promise is resolved
            let res = await data()

            // Displays the result after the Promise is completed
            document.write(res + "<br/>")

            // Final confirmation message
            document.write("Data checked" + "<br/>")
        }

        // Calling the async function
        get()


        /*
        ==========================================
        TASK 1
        ==========================================
        */

        // Returns a Promise representing the first task
        function task1() {

            return new Promise((resolve, reject) => {

                // Boolean value represents task status
                let status = true

                if (status) {

                    // Resolves the Promise after 3 seconds
                    setInterval(
                        () => resolve("First Task completed" + "<br/>"),
                        3000
                    )
                }
                else {

                    // Message displayed when task is incomplete
                    setInterval(
                        () => resolve("First Task yet to be completed" + "<br/>"),
                        3000
                    )
                }
            })
        }


        /*
        ==========================================
        TASK 2
        ==========================================
        */

        // Returns a Promise representing the second task
        function task2() {

            return new Promise((resolve, reject) => {

                // This task is currently marked as false
                let status = false

                if (status) {

                    // Resolves after 4 seconds
                    setInterval(
                        () => resolve("Second Task completed" + "<br/>"),
                        4000
                    )
                }
                else {

                    // Displays that the task is still incomplete
                    setInterval(
                        () => resolve("Second Task yet to be completed" + "<br/>"),
                        4000
                    )
                }
            })
        }


        /*
        ==========================================
        EXECUTING TASKS SEQUENTIALLY
        ==========================================
        */

        async function load() {

            // Displays loading message
            document.write("loading...." + "<br/>")

            // Waits for Task 1 to complete
            await task1()
                .then((res) => document.write(res) + "<br/>")
                .catch((err) => document.write(err) + "<br/>")

            // Waits for Task 2 after Task 1
            await task2()
                .then((res) => document.write(res) + "<br/>")
                .catch((err) => document.write(err) + "<br/>")

            // Displays final message
            document.write("Tasks completed" + "<br/>")
        }

        // Starts the task execution
        load()


        /*
        ==========================================
        ACCEPT FUNCTION
        ==========================================
        */

        function accept() {

            return new Promise((resolve, reject) => {

                // Resolves the Promise after 3 seconds
                setInterval(() => resolve("Accepting..."), 3000)
            })
        }


        /*
        ==========================================
        CONFIRM FUNCTION
        ==========================================
        */

        function conf() {

            return new Promise((resolve, reject) => {

                // Resolves the Promise after 3 seconds
                setInterval(() => resolve("Confirm"), 3000)
            })
        }


        /*
        ==========================================
        DOM MANIPULATION WITH ASYNC/AWAIT
        ==========================================
        */

        async function loade() {

            // Gets the <h2> element using its id
            let res = document.getElementById("id1")

            // Displays loading text
            res.innerHTML = "loading...."

            // Changes the background color to red
            res.style.backgroundColor = "red"

            // Waits for the accept() Promise
            // and displays the returned result
            res.innerHTML = await accept()

            // Changes the background color to yellow
            res.style.backgroundColor = "yellow"

            // Waits for the confirm() Promise
            // and displays the returned result
            res.innerHTML = await conf()

            // Changes the background color to green
            res.style.backgroundColor = "green"
        }

        // Starts the asynchronous operation
        loade()

    </script>

</body>
